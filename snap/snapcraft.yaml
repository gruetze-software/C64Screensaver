name: gruetze-retrosaver
title: Gruetze RetroSaver
base: core24
adopt-info: c64screensaver
summary: C64 BASIC, Amiga animations and glowing CRT effects
description: |
  Gruetze RetroSaver brings classic home-computer atmosphere to your desktop.
  Watch C64 BASIC being typed, corrected and executed, or enjoy Amiga-inspired
  Jump & run, Plasma and a bouncing checker ball with your own scrolling text.
  Adjust phosphor glow, scanlines, curvature and picture proportions in the
  companion app, then start a fullscreen preview.

  This snap does not replace your desktop's lock screen or automatically start
  when idle. Automatic screensaver integration depends on your desktop and
  compositor. GNOME on Wayland does not support third-party system screensavers.
  See the setup guide linked on the project website for other desktops.
grade: stable
confinement: strict
license: MIT
icon: C64Screensaver/Assets/app-icon.png
website: https://www.gruetze-software.de
source-code: https://github.com/gruetze-software/C64Screensaver
issues: https://github.com/gruetze-software/C64Screensaver/issues
platforms:
  amd64:
  arm64:
apps:
  gruetze-retrosaver:
    command: bin/launch
    desktop: gui/gruetze-retrosaver.desktop
    extensions: [gnome]
    plugs: [desktop, desktop-legacy, wayland, x11, opengl]
  screensaver:
    command: bin/launch --fullscreen
    extensions: [gnome]
    plugs: [desktop, desktop-legacy, wayland, x11, opengl]
parts:
  c64screensaver:
    plugin: dump
    source: snap/local/publish
    override-build: |
      test "$(cat BUILD-ARCH)" = "$CRAFT_ARCH_BUILD_FOR"
      craftctl default
      craftctl set version="$(cat BUILD-VERSION)"
    organize:
      '*': bin/
    stage-packages:
      - libicu74
      - libssl3t64
      - libkrb5-3
      - libunwind8
      - liblttng-ust1t64
      - libbrotli1
  launcher:
    plugin: dump
    source: snap/local/launcher
    organize:
      launch: bin/launch
