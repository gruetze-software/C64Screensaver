name: macOS builds
on:
  push:
    branches: [main, codex/macos-native-screensaver, codex/macos-integrated-package, codex/macos-diskutil]
  workflow_dispatch:
concurrency:
  group: macos-build-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  native-saver:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test Amiga startup and animations
        run: dotnet run --project tests/Amiga -c Release
      - name: Test managed C ABI
        run: dotnet run --project tests/NativeBridge -c Release
      - name: Measure CPU render budgets
        run: dotnet run --project tests/NativePerformance -c Release
      - name: Build native screensaver
        run: bash macos/build-native.sh ${{ matrix.arch }}
      - name: Build companion application
        run: bash macos/build-companion.sh ${{ matrix.arch }}
      - name: Test shared companion and screensaver settings
        run: bash macos/test-shared-settings.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Gruetze-RetroSaver-macOS-${{ matrix.arch }}
          path: |
            artifacts/macos-companion/osx-*/Gruetze-RetroSaver-*.dmg
            artifacts/macos-native/**/screenshots/*.png
            artifacts/amiga-review/*.png
