name: macOS builds
on:
  push:
    branches: [main, codex/macos-native-screensaver, codex/macos-integrated-package, codex/macos-diskutil, codex/scrollbar-spacing]
  workflow_dispatch:
    inputs:
      screenshots_only:
        description: Capture product views without rebuilding distribution packages
        type: boolean
        default: false
concurrency:
  group: macos-build-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  native-saver:
    if: ${{ inputs.screenshots_only != true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test Amiga startup and animations
        run: dotnet run --project tests/Amiga -c Release
      - name: Test managed C ABI
        run: dotnet run --project tests/NativeBridge -c Release
      - name: Measure CPU render budgets
        run: dotnet run --project tests/NativePerformance -c Release
      - name: Build native screensaver
        run: bash macos/build-native.sh ${{ matrix.arch }}
      - name: Test App Store sandbox startup and denied external access
        timeout-minutes: 5
        run: bash macos/test-store-sandbox.sh ${{ matrix.arch }}
      - name: Build companion application
        run: bash macos/build-companion.sh ${{ matrix.arch }}
      - name: Test actual macOS fullscreen
        run: dotnet run --project tests/MacUi -c Release
      - name: Test shared companion and screensaver settings
        run: bash macos/test-shared-settings.sh
      - name: Capture Mac product screenshots with isolated settings
        if: matrix.arch == 'arm64'
        run: dotnet run --project tests/StoreScreenshots -c Release
      - uses: actions/upload-artifact@v4
        if: matrix.arch == 'arm64'
        with:
          name: Gruetze-RetroSaver-Mac-Store-Screenshots
          path: |
            artifacts/store-screenshots/*.png
            artifacts/store-screenshots/README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Gruetze-RetroSaver-macOS-${{ matrix.arch }}
          path: |
            artifacts/macos-companion/osx-*/Gruetze-RetroSaver-*.dmg
            artifacts/macos-native/**/screenshots/*.png
            artifacts/amiga-review/*.png

  product-screenshots:
    if: ${{ inputs.screenshots_only == true }}
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Capture actual Mac app views with isolated settings
        run: dotnet run --project tests/StoreScreenshots -c Release
      - uses: actions/upload-artifact@v4
        with:
          name: Gruetze-RetroSaver-Mac-Store-Screenshots
          path: |
            artifacts/store-screenshots/*.png
            artifacts/store-screenshots/README.txt
